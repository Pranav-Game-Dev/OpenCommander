<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <linearGradient id="brutal_ring" x1="32" y1="32" x2="224" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <!-- High-Contrast Dark Frame -->
  <rect x="20" y="20" width="216" height="216" rx="52" fill="#0C0A09"/>
  <rect x="21" y="21" width="214" height="214" rx="51" stroke="#292524" stroke-width="2"/>

  <!-- Precision Corner Reticles (Desktop Viewport / Framing) -->
  <path d="M 48 68 L 48 48 L 68 48" stroke="#57534E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 188 48 L 208 48 L 208 68" stroke="#57534E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 48 188 L 48 208 L 68 208" stroke="#57534E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 188 208 L 208 208 L 208 188" stroke="#57534E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Octagonal Open-C Frame (O + C Structural Lock) -->
  <path d="M 176 86 L 154 64 L 102 64 L 74 92 L 74 164 L 102 192 L 154 192 L 176 170"
        stroke="url(#brutal_ring)" stroke-width="22" stroke-linecap="square" stroke-linejoin="miter"/>

  <!-- Negative-Space / High-Contrast Command Chevron + Prompt Bar -->
  <path d="M 114 104 L 142 128 L 114 152" stroke="#FAFAF9" stroke-width="18" stroke-linecap="square" stroke-linejoin="miter"/>
  <rect x="154" y="140" width="28" height="14" fill="#F97316"/>
</svg>
