<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <!-- Layered Mint -> Emerald -> Cyan-Teal Palette -->
    <linearGradient id="iso_v3_top" x1="60" y1="48" x2="188" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="iso_v3_spine" x1="60" y1="86" x2="120" y2="204" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="55%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#115E59"/>
    </linearGradient>
    <linearGradient id="iso_v3_bottom" x1="60" y1="168" x2="196" y2="188" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="iso_v3_arrow" x1="126" y1="98" x2="198" y2="158" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>
  </defs>

  <!-- Deep Forest-Slate Squircle -->
  <rect x="20" y="20" width="216" height="216" rx="52" fill="#070C0B"/>
  <rect x="21" y="21" width="214" height="214" rx="51" stroke="#16302B" stroke-width="2"/>

  <!-- Continuous Ribbon-Folded Isometric Cube (Top -> Left Spine -> Bottom Shelf) -->
  <!-- Top Roof Plane (Beveled Split) -->
  <polygon points="128,46 196,84 166,101 128,80 90,101 60,84" fill="url(#iso_v3_top)"/>

  <!-- Left Spine Plane (Carving the Structural 'C') -->
  <polygon points="60,84 90,101 90,155 60,172" fill="url(#iso_v3_spine)"/>

  <!-- Bottom Base Plane (Extending Forward to Anchor the Prompt) -->
  <polygon points="60,172 90,155 128,176 166,155 196,172 128,210" fill="url(#iso_v3_bottom)"/>

  <!-- Sculpted Isometric '>' Command Prism Suspended in the Hollow Core -->
  <polygon points="118,98 184,128 118,158 118,139 144,128 118,117" fill="url(#iso_v3_arrow)"/>

  <!-- Glowing Teal Prompt Cursor Block -->
  <polygon points="172,152 196,139 196,154 172,167" fill="#2DD4BF"/>
</svg>
