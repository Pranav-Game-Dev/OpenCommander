<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <!-- Expanded Emerald-to-Teal-to-Mint Palette -->
    <linearGradient id="iso_v2_top" x1="68" y1="44" x2="188" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="iso_v2_left" x1="60" y1="84" x2="132" y2="208" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="60%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="iso_v2_right_wing" x1="128" y1="116" x2="196" y2="184" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="iso_v2_chevron" x1="138" y1="98" x2="196" y2="156" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>
    <linearGradient id="iso_v2_cursor" x1="164" y1="158" x2="196" y2="178" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>

  <!-- Deep Teal-Obsidian Squircle -->
  <rect x="20" y="20" width="216" height="216" rx="52" fill="#070D0E"/>
  <rect x="21" y="21" width="214" height="214" rx="51" stroke="#132A2E" stroke-width="2"/>

  <!-- Subtle Isometric Rim Glow -->
  <polygon points="128,46 196,85 128,124 60,85" fill="url(#iso_v2_top)"/>
  <polygon points="60,85 128,124 128,206 60,167" fill="url(#iso_v2_left)"/>

  <!-- Interlocking Isometric '>' Facet Emerging From the Cube's Open Right Face -->
  <polygon points="128,104 196,136 128,168 128,146 158,136 128,126" fill="url(#iso_v2_chevron)"/>

  <!-- Isometric Base Underscore '_' Anchoring the Open Cavity -->
  <polygon points="128,206 196,167 196,151 128,190" fill="url(#iso_v2_cursor)"/>
</svg>
